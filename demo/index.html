<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B7A4B">
<meta name="description" content="牙翼 · 二手牙科设备挂网 + 自主上架 + 维修服务">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="牙翼">
<title>牙翼 · 二手牙科设备</title>
<style>
/* ===== 再美二手光电 · 效果演示样式（375 设计宽度，px） ===== */
:root {
  --green-800: #1D5535;
  --green-700: #2B7A4B;
  --green-600: #3FA362;
  --green-500: #6DC077;
  --green-400: #9ED486;
  --green-300: #C6E4A2;
  --green-200: #DFF0C4;
  --green-100: #EFF7DC;
  --green-50: #F5FAE8;
  --ink: #15171A;
  --ink-2: #3B4048;
  --ink-3: #6C727B;
  --gray: #8C929B;
  --gray-2: #B7BCC4;
  --line: #EFF1F4;
  --bg: #F6F7F9;
  --price: #F2555A;
  --sh-card: 0 2px 10px rgba(23, 43, 29, .06);
  --sh-float: 0 6px 18px rgba(32, 80, 52, .18);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: #E9ECEF;
  -webkit-font-smoothing: antialiased;
  font-size: 13px;
}
a { color: inherit; text-decoration: none; }
p, h1, h2, h3, h4 { margin: 0; font-weight: 400; }
ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; border: 0; outline: 0; background: none; }
svg { display: block; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ===== 应用容器（桌面居中成手机壳） ===== */
#app {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
  background: #fff;
  overflow: hidden;
}
@media (min-width: 480px) {
  body { padding: 20px 0; }
  #app { min-height: calc(100vh - 40px); box-shadow: 0 18px 50px rgba(21, 40, 28, .18); border-radius: 20px; }
}
.page { position: relative; min-height: 100vh; background: #F6F7F9; animation: fade .18s ease; }
.page-white { background: #fff; }
@keyframes fade { from { opacity: .6 } to { opacity: 1 } }
.page-tab { padding-bottom: 88px; }
.page-plain { padding-bottom: 30px; }
.page-detail-pad { padding-bottom: 92px; }

/* ===== 状态栏 + 胶囊（模拟小程序沉浸式头部） ===== */
.statusbar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  color: rgba(21, 40, 28, .82);
}
.statusbar .sb-r { display: flex; align-items: center; gap: 5px; }
.statusbar .sb-r i { display: block; width: 15px; height: 9px; border: 1.4px solid currentColor; border-radius: 2.5px; opacity: .85; }
.capsule {
  position: absolute;
  right: 12px;
  top: 10px;
  width: 88px;
  height: 30px;
  display: flex;
  align-items: center;
  border-radius: 15px;
  background: rgba(255, 255, 255, .62);
  border: 1px solid rgba(255, 255, 255, .85);
  color: #2A3B2E;
  z-index: 40;
  pointer-events: none;
}
.capsule .dots { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2.5px; }
.capsule .dots i { width: 3.5px; height: 3.5px; border-radius: 50%; background: currentColor; }
.capsule .dash { width: 1px; height: 16px; background: rgba(42, 59, 46, .18); }
.capsule .minus, .capsule .ring { flex: 1; display: flex; align-items: center; justify-content: center; }
.capsule .minus i { width: 11px; height: 1.6px; border-radius: 2px; background: currentColor; }
.capsule .ring i { width: 13px; height: 13px; border-radius: 50%; border: 1.6px solid currentColor; position: relative; }
.capsule .ring i::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: currentColor; }

/* ===== 导航标题 ===== */
.nav-title {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 600;
  color: #1E3325;
  letter-spacing: .5px;
  position: relative;
}
.nav-back {
  position: absolute;
  left: 6px;
  top: 0;
  width: 40px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}
.nav-back .ic { width: 20px; height: 20px; stroke-width: 2.2; }

/* ===== 头部渐变 ===== */
.hero {
  position: relative;
  background:
    radial-gradient(120% 90% at 8% 0%, #F7FBE4 0%, rgba(247, 251, 228, 0) 55%),
    linear-gradient(155deg, #F2F8DC 0%, #D9EDB2 32%, #A9DA92 62%, #6FC288 100%);
  padding-bottom: 20px;
}
.hero-soft {
  background:
    radial-gradient(110% 80% at 10% 0%, #F8FBE8 0%, rgba(248, 251, 232, 0) 60%),
    linear-gradient(160deg, #F2F8DC 0%, #D5EBAE 32%, #9FD58B 66%, #58BE85 100%);
}
.hero-flat { padding-bottom: 12px; }

/* ===== 搜索行 ===== */
.search-row { display: flex; align-items: center; padding: 6px 15px 2px; }
.city {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 15px;
  font-weight: 700;
  color: #14251A;
  margin-right: 10px;
  cursor: pointer;
}
.city .ic { width: 12px; height: 12px; }
.city-txt { max-width: 64px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.search-pill {
  flex: 1;
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 4px 0 15px;
  border-radius: 18px;
  border: 2px solid #101010;
  background: rgba(255, 255, 255, .5);
  cursor: pointer;
}
.search-pill .ph { flex: 1; font-size: 13px; color: #55605A; letter-spacing: .4px; }
.search-pill .go {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: #101010;
  color: #fff;
  display: grid;
  place-items: center;
}
.search-pill .go .ic { width: 14px; height: 14px; stroke-width: 2.4; }

/* ===== 分区标题 / 工具 ===== */
.sec-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 14px 10px; }
.sec-head h3 { font-size: 16px; font-weight: 700; }
.sec-head .more { display: flex; align-items: center; gap: 2px; font-size: 12px; color: var(--gray); }
.sec-head .more .ic { width: 12px; height: 12px; }
.empty { padding: 60px 0; text-align: center; font-size: 13px; color: var(--gray-2); }
.list-end { padding: 30px 0 20px; text-align: center; font-size: 11px; color: var(--gray-2); }

/* ===== chips ===== */
.chips { display: flex; gap: 10px; padding: 12px 14px 6px; }
.chip {
  flex: 1;
  height: 28px;
  padding: 0 6px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 13px;
  color: var(--ink-3);
  background: #F1F2F4;
  white-space: nowrap;
  cursor: pointer;
  transition: .16s;
}
.chip .ic { width: 11px; height: 11px; }
.chip.on { background: var(--green-200); color: var(--green-700); font-weight: 700; }
.chip-auto { flex: 0 0 auto; padding: 0 15px; }

/* ===== 按钮 ===== */
.mini-btn {
  padding: 4px 9px;
  border-radius: 11px;
  background: linear-gradient(135deg, #DCF1B8, #C3E4A0);
  color: var(--green-700);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.btn-solid {
  height: 42px;
  border-radius: 21px;
  background: linear-gradient(120deg, #A8DA8A, #4FB877);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 14px rgba(79, 184, 119, .32);
  cursor: pointer;
}
.btn-ghost {
  height: 42px;
  border-radius: 21px;
  border: 1.5px solid var(--green-400);
  color: var(--green-700);
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* ===== 底部 tabBar ===== */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  margin: 0 auto;
  width: 100%;
  max-width: 420px;
  height: 74px;
  background: #fff;
  display: flex;
  align-items: flex-start;
  padding-top: 8px;
  box-shadow: 0 -2px 14px rgba(23, 43, 29, .08);
  z-index: 60;
}
@media (min-width: 480px) {
  .tabbar { bottom: 20px; border-radius: 0 0 20px 20px; }
}
.tabbar .tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: #7E858F;
  cursor: pointer;
}
.tabbar .tab.on { color: var(--green-700); font-weight: 700; }
.tabbar .tab .ic { width: 23px; height: 23px; stroke-width: 1.55; }
.tab-center { position: relative; flex: 1; cursor: pointer; }
.tab-center .bubble {
  position: absolute;
  top: -17px; left: 50%;
  transform: translateX(-50%);
  width: 56px; height: 56px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, #FBFDE8, #DFF0B4 45%, #9AD289 100%);
  box-shadow: 0 0 0 4px #fff, 0 8px 18px rgba(79, 184, 119, .35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  color: #14251A;
}
.tab-center .bubble b { font-size: 19px; font-weight: 800; letter-spacing: -1px; }
.tab-center .bubble i { font-style: normal; font-size: 8.5px; font-weight: 700; margin-top: 5px; }

/* ===== 悬浮咨询 ===== */
.consult {
  position: fixed;
  right: max(8px, calc(50% - 202px));
  bottom: 100px;
  width: 66px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 55;
  cursor: pointer;
}
.consult .av {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #F3FADC, #B7E08C 70%);
  border: 2px solid #fff;
  box-shadow: 0 4px 12px rgba(30, 80, 45, .22);
  display: grid;
  place-items: center;
  color: #23412C;
}
.consult .av .ic { width: 22px; height: 22px; }
.consult .tx {
  margin-top: -7px;
  padding: 1px 6px;
  border-radius: 8px;
  background: linear-gradient(135deg, #8FD08A, #4FB877);
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  white-space: nowrap;
}

/* ===== 首页 Banner ===== */
.banner {
  position: relative;
  margin: 12px 14px 0;
  height: 132px;
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(120deg, #FFFFFF 0%, #F3F8EA 40%, #CFE7C0 100%);
  box-shadow: var(--sh-card);
  cursor: pointer;
}
.banner .b-tag { position: absolute; left: 14px; top: 14px; padding: 3px 9px; border-radius: 10px; background: rgba(21, 40, 28, .82); color: #fff; font-size: 10px; }
.banner .b-title { position: absolute; left: 14px; top: 38px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; color: #14251A; line-height: 1.1; }
.banner .b-title em { font-style: normal; color: var(--green-700); }
.banner .b-en { position: absolute; left: 14px; top: 74px; font-size: 9px; letter-spacing: 1.6px; color: #6E8A76; }
.banner .b-desc { position: absolute; left: 14px; bottom: 16px; display: flex; gap: 6px; }
.banner .b-desc span { padding: 3px 8px; background: rgba(255, 255, 255, .75); border-radius: 10px; font-size: 10px; color: var(--green-700); font-weight: 600; }
.banner .b-art {
  position: absolute; right: -6px; bottom: -10px;
  width: 118px; height: 118px;
  border-radius: 26px;
  background: linear-gradient(150deg, #fff, #E7F3D6);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .8), 0 10px 22px rgba(45, 100, 60, .14);
  display: grid; place-items: center;
  color: var(--green-700);
  font-size: 34px; font-weight: 800;
}
.banner .b-dots { position: absolute; right: 12px; top: 12px; display: flex; gap: 3px; }
.banner .b-dots i { width: 4px; height: 4px; border-radius: 50%; background: rgba(21, 40, 28, .2); }
.banner .b-dots i.on { width: 10px; border-radius: 2px; background: var(--green-700); }

/* ===== 六宫格 ===== */
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; padding: 14px 14px 0; }
.cat {
  position: relative;
  height: 88px;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #fff;
  overflow: hidden;
  box-shadow: 0 6px 14px rgba(60, 80, 120, .14);
  cursor: pointer;
}
.cat::after { content: ''; position: absolute; left: -20%; top: -60%; width: 90%; height: 90%; border-radius: 50%; background: rgba(255, 255, 255, .18); }
.cat .ic { width: 28px; height: 28px; stroke-width: 1.6; }
.cat span { font-size: 13px; font-weight: 700; letter-spacing: .5px; }
.cat-1 { background: linear-gradient(140deg, #FFB0B8, #F0579A); }
.cat-2 { background: linear-gradient(140deg, #9FA0FF, #6667F0); }
.cat-3 { background: linear-gradient(140deg, #7BE9D2, #2CCFB2); }
.cat-4 { background: linear-gradient(140deg, #9FB0FF, #6E63F0); }
.cat-5 { background: linear-gradient(140deg, #FFC46B, #FF7E5F); }
.cat-6 { background: linear-gradient(140deg, #FFA3D5, #FF6AA8); }

/* ===== 公告 ===== */
.notice {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 12px 14px 0;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--green-50);
  color: #4C7A56;
  font-size: 11.5px;
}
.notice .ic { width: 14px; height: 14px; color: var(--green-600); }
.notice span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== 瀑布流 ===== */
.waterfall { display: flex; padding: 6px 14px 0; gap: 10px; }
.wf-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.pcard { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--sh-card); cursor: pointer; }
.pcard-media { position: relative; width: 100%; background: #E4EAF1; overflow: hidden; }
.pcard-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-tag {
  position: absolute; left: 8px; top: 8px;
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 10px;
  color: #fff;
  background: rgba(21, 40, 28, .55);
}
.seal {
  position: absolute; right: 6px; bottom: 6px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #EAF7DA, #B9DE8C 70%);
  border: 2px dashed rgba(43, 122, 75, .5);
  display: grid;
  place-items: center;
  color: var(--green-700);
}
.seal .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.pcard-body { padding: 8px 9px 10px; }
.pcard-title {
  font-size: 13px; font-weight: 700; line-height: 1.35; color: #1B1E22;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.pcard-title em { font-style: normal; color: var(--green-600); font-weight: 800; margin-right: 3px; }
.pcard-sub { margin-top: 5px; font-size: 10.5px; color: var(--gray); }
.pcard-foot { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; }
.link { display: inline-flex; align-items: center; gap: 1px; font-size: 12px; color: var(--green-600); font-weight: 600; }
.link .ic { width: 11px; height: 11px; }

/* ===== 列表大卡 ===== */
.lcard {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #fff;
  border-radius: 12px;
  box-shadow: var(--sh-card);
  margin: 0 14px 10px;
  cursor: pointer;
}
.lcard-media { position: relative; width: 108px; height: 96px; flex: 0 0 auto; border-radius: 10px; overflow: hidden; background: #E4EAF1; }
.lcard-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lcard-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lcard-main h4 { font-size: 13px; font-weight: 700; line-height: 1.36; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lcard-sub { margin-top: 4px; font-size: 11px; color: var(--gray); }
.lcard-tags { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
.lcard-tags i { font-style: normal; font-size: 10px; padding: 2px 6px; border-radius: 4px; color: var(--green-700); background: var(--green-100); }
.lcard-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
.price { font-size: 16px; font-weight: 800; color: var(--price); }
.price small { font-size: 10px; font-weight: 600; margin-left: 2px; }

/* ===== 页面通用留白 ===== */
.pad { padding-left: 14px; padding-right: 14px; }

/* ===== 甄选页 ===== */
.pick-banner {
  position: relative;
  margin: 10px 14px 0;
  height: 116px;
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(120deg, #DDF1F6 0%, #EAF6E6 52%, #FBF6D5 100%);
  box-shadow: var(--sh-card);
}
.pick-banner .pb-tag {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  padding: 3px 10px; border-radius: 10px; background: #16281C; color: #fff; font-size: 10px; white-space: nowrap;
}
.pick-banner .pb-title { position: absolute; left: 14px; top: 40px; font-size: 21px; font-weight: 800; letter-spacing: -.5px; color: #14251A; }
.pick-banner .pb-en { position: absolute; left: 14px; top: 70px; font-size: 8.5px; letter-spacing: 1.4px; color: #6E8A76; }
.pick-banner .pb-sub { position: absolute; left: 14px; bottom: 13px; display: flex; gap: 6px; }
.pick-banner .pb-sub span { font-size: 10px; color: var(--green-700); font-weight: 600; background: rgba(255, 255, 255, .8); border-radius: 9px; padding: 2px 7px; }
.pick-banner .pb-phone {
  position: absolute; right: 12px; top: 14px;
  width: 82px; height: 104px;
  border-radius: 12px; padding: 6px;
  background: linear-gradient(160deg, #1B2A20, #2E4234);
  box-shadow: 0 8px 18px rgba(30, 60, 45, .22);
}
.pick-banner .pb-phone div {
  width: 100%; height: 100%; border-radius: 8px;
  background: linear-gradient(160deg, #F2FAD9, #CDE7A8);
  display: grid; place-items: center;
  font-size: 22px; font-weight: 800; color: #1E3325;
}
.pick-note {
  display: flex; align-items: center; gap: 6px;
  margin: 8px 14px 0;
  padding: 7px 10px;
  border-radius: 9px;
  background: var(--green-100);
  font-size: 11.5px;
  color: var(--green-700);
}
.pick-note .ic { width: 14px; height: 14px; }

/* ===== 列表页 ===== */
.l-top {
  background:
    radial-gradient(120% 90% at 8% 0%, #F7FBE4 0%, rgba(247, 251, 228, 0) 55%),
    linear-gradient(155deg, #F2F8DC 0%, #D9EDB2 40%, #A9DA92 70%, #7FC98D 100%);
  padding-bottom: 4px;
}
.sort-bar { display: flex; align-items: center; padding: 4px 14px 9px; }
.sort-item {
  flex: 1; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--ink-2); cursor: pointer;
}
.sort-item.on { color: var(--green-700); font-weight: 800; }
.sort-arrow { font-size: 10px; margin-left: 2px; }
.sort-filter {
  width: 32px; height: 28px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .8);
  display: flex; align-items: center; justify-content: center;
  margin-left: 4px; cursor: pointer;
}
.sort-filter .ic { width: 16px; height: 16px; }
.cat-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cat-scroll::-webkit-scrollbar { height: 0; }
.cat-chips { display: inline-flex; padding: 6px 14px 4px; gap: 9px; }
.total-line {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 10px;
  font-size: 11.5px; color: var(--gray);
}
.total-line b { color: var(--green-700); }

/* ===== 详情页 ===== */
.d-media { position: relative; width: 100%; height: 268px; background: #E4EAF1; overflow: hidden; }
.d-swiper {
  display: flex;
  width: 100%;
  height: 100%;

  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  border: 1.5px solid #C6E4A2;
  color: #2B7A4B;
  background: #fff;
}
.lead-btn.primary {
  border: 0;
  color: #fff;
  background: linear-gradient(120deg, #A8DA8A, #3F8F5B);
  box-shadow: 0 8px 20px rgba(63, 143, 91, .28);
}
.lead-close { margin-top: 10px; text-align: center; font-size: 12.5px; color: var(--gray); cursor: pointer; }

/* ============================================================
   保存与分享
   ============================================================ */
.save-row { display: flex; gap: 9px; }
.save-item {
  flex: 1;
  padding: 12px 8px;
  background: #fff;
  border-radius: 12px;
  box-shadow: var(--sh-card);
  text-align: center;
  cursor: pointer;
}
.si-ic {
  width: 30px; height: 30px;
  margin: 0 auto 7px;
  border-radius: 9px;
  background: linear-gradient(140deg, #DFF0C4, #7FCB86);
  color: #1F6B45;
  display: grid;
  place-items: center;
}
.si-ic .ic { width: 17px; height: 17px; stroke-width: 2.2; }
.save-item b { display: block; font-size: 12px; color: #1B1E22; }
.save-item small { display: block; font-size: 9.5px; color: var(--gray); margin-top: 3px; }

/* ============================================================
   弹层里的微信号引导
   ============================================================ */
.lead-wx {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #EDF7E4;
  border: 1px dashed #BEDDA0;
}
.lw-label { font-size: 11.5px; color: #4C7A56; flex: 0 0 auto; }
.lw-num {
  flex: 1;
  font-size: 15px;
  font-weight: 800;
  color: #1F6B45;
  letter-spacing: .5px;
  -webkit-user-select: text;
  user-select: text;
}
.lw-copy {
  flex: 0 0 auto;
  padding: 5px 11px;
  border-radius: 12px;
  background: linear-gradient(120deg, #A8DA8A, #3F8F5B);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}

</style>

/* 数据层（Supabase REST） */
/* ============================================================
 * 牙翼 · 后端数据层（Supabase REST，不依赖任何 SDK）
 *   window.ZM_DB.ready === false 时，页面走本地演示数据
 * ============================================================ */
;(function () {
  var CFG = window.ZM_CONFIG || {}
  var URL = String(CFG.supabaseUrl || '').replace(/\/+$/, '')
  var KEY = CFG.supabaseKey || ''
  var BUCKET = CFG.bucket || 'device-images'
  var TOKEN_KEY = 'zm_owner_token'

  var token = ''
  try { token = localStorage.getItem(TOKEN_KEY) || '' } catch (e) {}

  function hdr (extra) {
    var h = { apikey: KEY, Authorization: 'Bearer ' + (token || KEY) }
    if (extra) for (var k in extra) h[k] = extra[k]
    return h
  }

  function req (path, opt) {
    opt = opt || {}
    return fetch(URL + path, {
      method: opt.method || 'GET',
      headers: hdr(opt.headers),
      body: opt.body === undefined ? undefined : JSON.stringify(opt.body)
    }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) { throw new Error('接口错误 ' + r.status + '：' + t.slice(0, 160)) })
      }
      return r.status === 204 ? null : r.json()
    })
  }

  var DB = {
    ready: !!(URL && KEY),
    get logged () { return !!token },

    /* ---------- 店主登录 ---------- */
    login: function (email, password) {
      return fetch(URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      }).then(function (r) {
        if (!r.ok) return r.text().then(function () { throw new Error('账号或密码不正确') })
        return r.json()
      }).then(function (j) {
        token = j.access_token
        try { localStorage.setItem(TOKEN_KEY, token) } catch (e) {}
        return j
      })
    },

    logout: function () {
      token = ''
      try { localStorage.removeItem(TOKEN_KEY) } catch (e) {}
    },

    /* ---------- 设备 ---------- */
    listDevices: function () {
      return req('/rest/v1/devices?select=*&order=sort_order.desc,created_at.desc')
    },

    createDevice: function (row) {
      return req('/rest/v1/devices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: row
      })
    },

    updateDevice: function (id, patch) {
      return req('/rest/v1/devices?id=eq.' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: patch
      })
    },

    deleteDevice: function (id) {
      return req('/rest/v1/devices?id=eq.' + id, { method: 'DELETE' })
    },

    incView: function (id) {
      return req('/rest/v1/rpc/inc_view', { method: 'POST', body: { device_id: id } }).catch(function () {})
    },

    /* ---------- 图片上传 ---------- */
    uploadImage: function (file) {
      var ext = (file.name || 'x.jpg').split('.').pop().toLowerCase()
      var path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext
      return fetch(URL + '/storage/v1/object/' + BUCKET + '/' + path, {
        method: 'POST',
        headers: {
          apikey: KEY,
          Authorization: 'Bearer ' + token,
          'Content-Type': file.type || 'image/jpeg',
          'x-upsert': 'true'
        },
        body: file
      }).then(function (r) {
        if (!r.ok) return r.text().then(function () { throw new Error('图片上传失败') })
        return URL + '/storage/v1/object/public/' + BUCKET + '/' + path
      })
    },

    /* ---------- 卖机线索 ---------- */
    createLead: function (row) {
      return req('/rest/v1/sell_leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: row
      })
    },
    listLeads: function () {
      return req('/rest/v1/sell_leads?select=*&order=created_at.desc')
    },
    markLead: function (id, handled) {
      return req('/rest/v1/sell_leads?id=eq.' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: { handled: !!handled }
      })
    },

    /* ---------- 维修工单 ---------- */
    createRepair: function (row) {
      return req('/rest/v1/repair_orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: row
      })
    },
    listRepairs: function () {
      return req('/rest/v1/repair_orders?select=*&order=created_at.desc')
    },
    updateRepair: function (id, patch) {
      return req('/rest/v1/repair_orders?id=eq.' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: patch
      })
    }
  }

  window.ZM_DB = DB
})()

  function priceHTML (p) {
    if (p === null || p === undefined) return '<span class="price">面议</span>'
    if (p >= 10000) return '<span class="price">¥' + Math.round(p / 1000) / 10 + '<small>万</small></span>'
    return '<span class="price">¥' + p + '<small>元</small></span>'
  }
  function priceNum (p) {
    if (p === null || p === undefined) return '面议'
    return p >= 10000 ? '¥' + Math.round(p / 1000) / 10 + '万' : '¥' + p + '元'
  }
  function subText (d) {
    return [d.categoryName, d.condition, d.year ? d.year + '年' : ''].filter(Boolean).join(' · ')
  }

  function applySort (list, sort) {
    var arr = list.slice()
    var big = 1e15
    if (sort === 'priceAsc') return arr.sort(function (a, b) { return (a.price == null ? big : a.price) - (b.price == null ? big : b.price) })
    if (sort === 'priceDesc') return arr.sort(function (a, b) { return (b.price == null ? -1 : b.price) - (a.price == null ? -1 : a.price) })
    if (sort === 'distance') return arr.sort(function (a, b) { return a.distanceKm - b.distanceKm })
    if (sort === 'new') return arr.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1 })
    return arr
  }

  function filterDevices (opt) {
    opt = opt || {}
    var list = catalog()
    if (opt.pickOnly) list = list.filter(function (d) { return d.isPick })
    if (opt.categoryId) list = list.filter(function (d) { return d.categoryId === opt.categoryId })
    if (opt.city && opt.city !== '全国') list = list.filter(function (d) { return d.city === opt.city })
    if (opt.brand && opt.brand !== '全部品牌') list = list.filter(function (d) { return d.brand === opt.brand })
    if (opt.yearIndex) {
      var ym = {
        1: function (d) { return d.year >= 2023 },
        2: function (d) { return d.year >= 2021 && d.year <= 2022 },
        3: function (d) { return d.year >= 2019 && d.year <= 2020 },
        4: function (d) { return d.year && d.year < 2019 }
      }
      if (ym[opt.yearIndex]) list = list.filter(ym[opt.yearIndex])
    }
    if (opt.priceIndex) {
      var pm = {
        1: function (d) { return d.price != null && d.price < 10000 },
        2: function (d) { return d.price != null && d.price >= 10000 && d.price < 100000 },
        3: function (d) { return d.price != null && d.price >= 100000 && d.price < 500000 },
        4: function (d) { return d.price != null && d.price >= 500000 }
      }
      if (pm[opt.priceIndex]) list = list.filter(pm[opt.priceIndex])
    }
    if (opt.keyword) {
      var k = String(opt.keyword).toLowerCase().trim()
      if (k) {
        list = list.filter(function (d) {
          return (d.title + d.brand + d.model + d.categoryName).toLowerCase().indexOf(k) > -1
        })
      }
    }
    return applySort(list, opt.sort)
  }

  function splitCols (list) {
    var colA = [], colB = [], hA = 0, hB = 0
    list.forEach(function (it) {
      var h = (it.h || 160) + 84
      if (hA <= hB) { colA.push(it); hA += h } else { colB.push(it); hB += h }
    })
    return { colA: colA, colB: colB }
  }

  /* ---------------- 发布 / 编辑商品 ---------------- */
  function blankForm () {
    return {
      images: [], title: '', cat: 0, brand: 0, model: '',
      condition: 2, year: 2, useYears: '', registerNo: '',
      installIncluded: true, warranty: '',
      price: '', negotiable: true, city: 0,
      contact: '', phone: '', params: ['', ''], files: []
    }
  }

  function pagePublish (params) {
    var p = pack()
    var isEstimate = params && params.from === 'estimate'
    var editId = params && params.edit
    if (editId && String(editId).charAt(0) === 'D' && state.remoteDevices) {
      var rd = state.remoteDevices.filter(function (x) { return x.id === editId })[0]
      if (rd) {
        state.editingId = editId
        state.form = {
          images: rd.images.slice(),
          files: [],
          title: rd.title, cat: Math.max(0, (rd.categoryId || 1) - 1),
          brand: Math.max(0, p.brands.filter(function (b) { return b !== '全部品牌' }).indexOf(rd.brand)),
          model: rd.model, condition: Math.max(0, D.CONDITION_OPTIONS.indexOf(rd.condition)),
          year: Math.max(0, D.YEAR_OPTIONS.indexOf((rd.year || 2024) + ' 年')),
          useYears: rd.useYears || '', registerNo: rd.registerNo || '',
          installIncluded: rd.installIncluded !== false, warranty: rd.warranty || '',
          price: rd.price ? String(rd.price / 10000) : '', negotiable: rd.negotiable !== false,
          city: Math.max(0, D.CITIES.filter(function (c) { return c !== '全国' }).indexOf(rd.city)),
          contact: '', phone: '',
          params: [(rd.specs[0] ? rd.specs[0][1] : ''), (rd.specs[1] ? rd.specs[1][1] : '')]
        }
      }
    } else if (editId) {
      if (state.editingId !== editId || !state.form) {
        var it = state.myItems.filter(function (x) { return x.id === editId })[0]
        if (it) {
          state.editingId = editId
          state.form = {
            images: it.images.slice(),
            title: it.title, cat: Math.max(0, it.categoryId - 1),
            brand: Math.max(0, p.brands.filter(function (b) { return b !== '全部品牌' }).indexOf(it.brand)),
            model: it.model, condition: Math.max(0, D.CONDITION_OPTIONS.indexOf(it.condition)),
            year: Math.max(0, D.YEAR_OPTIONS.indexOf((it.year || 2024) + ' 年')),
            useYears: it.useYears || '', registerNo: it.registerNo || '',
            installIncluded: it.installIncluded !== false, warranty: it.warranty || '',
            price: it.price ? String(it.price / 10000) : '', negotiable: it.negotiable !== false,
            city: Math.max(0, D.CITIES.filter(function (c) { return c !== '全国' }).indexOf(it.city)),
            contact: it.contact || '', phone: it.phone || '',
            params: [
              (it.specs && it.specs[0] ? it.specs[0][1] : ''),
              (it.specs && it.specs[1] ? it.specs[1][1] : '')
            ].slice(0, 2)
          }
        }
      }
    } else if (!state.form || state.editingId) {
      state.form = blankForm()
      state.editingId = null
    }

    var f = state.form
    var cats = p.cats.filter(function (c) { return c.id > 0 })
    var brands = p.brands.filter(function (b) { return b !== '全部品牌' })
    var cityList = D.CITIES.filter(function (c) { return c !== '全国' })
    var tmpl = (p.paramTemplates[(f.cat || 0) + 1] || [['参数一', ''], ['参数二', '']])

    function row (label, req, inner) {

    function pickerRow (label, req, text, type) {
      return row(label, req, '<span class="f-val" data-act="pick-form" data-type="' + type + '">' + text + '</span>' +
        icon('arrow', 'width:13px;height:13px;color:#B7BCC4'))

    function switchRow (label, on, type) {

    }

    return '<div class="page page-plain" style="padding-bottom:96px">' +
      '<div class="p-top">' + statusbar() + capsule() +
      '<div class="nav-title"><span class="nav-back" data-act="back">' + icon('back') + '</span>' +
      (isEstimate ? '免费估价' : (editId ? '编辑商品' : '发布商品')) + '</div>' +
      (isEstimate ? '' : '<div class="steps">' +
        '<div class="step on"><i>1</i><span>商品图片</span></div><div class="step-line"></div>' +
        '<div class="step on"><i>2</i><span>基本信息</span></div><div class="step-line"></div>' +
        '<div class="step"><i>3</i><span>提交上架</span></div>' +
        '</div>') +
      '</div>' +

      (isEstimate ? '<div class="estimate-tip">不确定价格？先把设备信息填好，平台会给出参考估价区间。</div>' : '') +
      domainTip() +

      '<div class="f-card"><div class="f-title">商品图片<small>最多 9 张，建议首图为整机正面</small></div>' +
      '<div class="upload">' +
      f.images.map(function (src, i) {
        return '<div class="u-item"><img src="' + src + '" alt="">' +
          '<span class="u-del" data-act="del-img" data-i="' + i + '">' + icon('close') + '</span></div>'
      }).join('') +
      (f.images.length < 9 ? '<div class="u-add" data-act="upload">' + icon('plus') + '<span>' + f.images.length + '/9</span></div>' : '') +
      '</div></div>' +

      '<div class="f-card"><div class="f-title">基本信息</div>' +
      row('商品标题', true, '<input data-field="title" value="' + f.title + '" placeholder="如：卡瓦 E70 牙科综合治疗台 双椅位">') +
      pickerRow('设备类目', true, cats[f.cat].name, 'cat') +
      pickerRow('品牌', true, brands[f.brand], 'brand') +
      row('型号', false, '<input data-field="model" value="' + f.model + '" placeholder="如：Estetica E70">') +
      pickerRow('成色', true, D.CONDITION_OPTIONS[f.condition], 'cond') +
      pickerRow('出厂年份', true, D.YEAR_OPTIONS[f.year], 'year') +
      row('使用年限', false, '<input data-field="useYears" value="' + f.useYears + '" placeholder="如：使用约 3 年 / 1200 人次">') +
      '</div>' +

      '<div class="f-card"><div class="f-title">合规与参数<small>按类目自动切换参数项</small></div>' +
      row('注册证号', false, '<input data-field="registerNo" value="' + f.registerNo + '" placeholder="如：国械注进 20173061234">') +
      switchRow('含安装调试', f.installIncluded, 'installIncluded') +
      row('原厂保修', false, '<input data-field="warranty" value="' + f.warranty + '" placeholder="如：剩余 8 个月 / 已过保">') +
      row(tmpl[0][0], false, '<input data-field="p0" value="' + (f.params[0] || '') + '" placeholder="' + tmpl[0][1] + '">') +
      row(tmpl[1][0], false, '<input data-field="p1" value="' + (f.params[1] || '') + '" placeholder="' + tmpl[1][1] + '">') +

      switchRow('可否议价', f.negotiable, 'negotiable') +

      row('联系人', true, '<input data-field="contact" value="' + f.contact + '" placeholder="请输入您的称呼">') +
      row('手机号', true, '<input data-field="phone" type="tel" maxlength="11" value="' + f.phone + '" placeholder="用于买家与您联系">') +

  /* ---------------- 店主登录 ---------------- */
  function showLogin (after) {
    closeOverlay()
    overlay = document.createElement('div')
    overlay.className = 'mask center'
    overlay.innerHTML = '<div class="lead" style="width:300px">' +
      '<div class="lead-title">店主登录</div>' +
      '<div class="lead-tip">只有店主能上架设备</div>' +
      '<input id="lgEmail" class="lg-input" type="email" placeholder="邮箱" autocomplete="username">' +
      '<input id="lgPass" class="lg-input" type="password" placeholder="密码" autocomplete="current-password">' +
      '<div class="lead-ops" style="margin-top:14px">' +
      '<span class="lead-btn" data-lead="lg-close">取消</span>' +
      '<span class="lead-btn primary" data-lead="lg-go">登录</span>' +
      '</div></div>'
    document.body.appendChild(overlay)
    overlay.addEventListener('click', function (e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-lead')
      if (a === 'lg-close' || e.target === overlay) { closeOverlay(); return }
      if (a === 'lg-go') {
        var em = document.getElementById('lgEmail').value.trim()
        var pw = document.getElementById('lgPass').value
        if (!em || !pw) return toast('请输入邮箱和密码')
        DB.login(em, pw).then(function () {
          closeOverlay()
          toast('登录成功')
          state.ownerLogged = true
          bootRemote(function () { if (after) after(); else render() })
        }).catch(function (err) { toast(err.message) })
      }
    })
  }

  /* ---------------- 弹层 ---------------- */
  var overlay = null
  function closeOverlay () {
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay)
    overlay = null
  }
  function showSheet (title, options, current, onPick) {
    closeOverlay()
    overlay = document.createElement('div')
    overlay.className = 'mask'
    overlay.innerHTML = '<div class="sheet">' +
      (title ? '<div class="sheet-title">' + title + '</div>' : '') +
      options.map(function (o, i) {
        return '<div class="sheet-opt ' + (i === current ? 'on' : '') + '" data-i="' + i + '">' + o + '</div>'
      }).join('') +
      '<div class="sheet-opt" data-i="-1" style="text-align:center;color:#8C929B">取消</div></div>'
    document.body.appendChild(overlay)
    overlay.addEventListener('click', function (e) {
      var t = e.target.closest('.sheet-opt')
      if (e.target === overlay) { closeOverlay(); return }
      if (!t) return
      var i = Number(t.dataset.i)
      closeOverlay()
      if (i >= 0) onPick(i)
    })
  }
  function showDialog (title, body, onOk, confirmText) {
    closeOverlay()
    overlay = document.createElement('div')
    overlay.className = 'mask center'
    overlay.innerHTML = '<div class="dialog"><div class="d-title">' + title + '</div>' +
      '<div class="d-body">' + body + '</div><div class="d-btn">' + (confirmText || '知道了') + '</div></div>'
    document.body.appendChild(overlay)
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target.classList.contains('d-btn')) {
        closeOverlay()
        if (onOk) onOk()
      }
    })
  }
  var toastTimer = null
  function toast (msg) {
    var el = document.querySelector('.toast')
    if (el) el.parentNode.removeChild(el)
    el = document.createElement('div')
    el.className = 'toast'
    el.textContent = msg
    document.body.appendChild(el)
    clearTimeout(toastTimer)
    toastTimer = setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el)
    }, 1600)
  }

  /* ---------------- 线索外发（复制 / 拨号） ---------------- */
  function copyText (text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text)
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea')
      ta.value = text
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'
      document.body.appendChild(ta)
      ta.focus()
      ta.select()
      var ok = false
      try { ok = document.execCommand('copy') } catch (e) {}
      document.body.removeChild(ta)
      ok ? resolve() : reject(new Error('copy failed'))
    })
  }

  /* ---------------- 路由 ---------------- */
  var app = document.getElementById('app')

  function parseHash () {
    var h = (location.hash || '').replace(/^#\/?/, '')
    if (!h) h = 'home'
    var parts = h.split('?')
    var params = {}
    ;(parts[1] || '').split('&').forEach(function (kv) {
      if (!kv) return
      var pp = kv.split('=')
      params[pp[0]] = decodeURIComponent(pp[1] || '')
    })
    return { name: parts[0] || 'home', params: params }
  }

  var SCREENS = {
    home: pageHome, pick: pagePick, list: pageList, detail: pageDetail,
    publish: pagePublish, seller: pageSeller, search: pageSearch,
    repair: pageRepair, 'repair-orders': pageOrders, sell: pageSell,
    news: pageNews, mine: pageMine, wall: pageWall
  }

  function render () {
    var r = parseHash()
    var fn = SCREENS[r.name] || pageHome
    app.classList.toggle('full', r.name === 'wall')
    app.innerHTML = fn(r.params)
    if (r.name !== 'search') window.scrollTo(0, 0)
    wirePage()
  }

  function go (to) { location.hash = '#/' + to; closeOverlay() }

  /* ---------------- 交互 ---------------- */
  function wirePage () {
    var swiper = document.querySelector('.d-swiper')
    if (swiper) {
      swiper.addEventListener('scroll', function () {
        var total = swiper.children.length
        var i = Math.round(swiper.scrollLeft / swiper.clientWidth) + 1
        var el = document.querySelector('.d-count')
        if (el) el.textContent = Math.min(i, total) + ' / ' + total
      })
    }
    var input = document.getElementById('kwInput')
    if (input) {
      input.addEventListener('input', function () { state.keyword = input.value })
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch() })
      setTimeout(function () {
        try { input.focus({ preventScroll: true }) } catch (e) { input.focus() }
      }, 60)
    }
    var desc = document.getElementById('rpDesc')
    if (desc) {
      desc.addEventListener('input', function () {
        state.repair.desc = desc.value
        var c = document.getElementById('rpCount')
        if (c) c.textContent = desc.value.length
      })
    }
    var odInput = document.getElementById('odInput')
    if (odInput) {
      odInput.addEventListener('input', function () { state.orderKeyword = odInput.value })
      odInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { render() } })
    }
    document.querySelectorAll('[data-field]').forEach(function (el) {
      el.addEventListener('input', function () {
        var k = el.dataset.field
        if (k.indexOf('s_') === 0) {
          if (!state.sellForm) return
          state.sellForm[k.slice(2)] = el.value
          return
        }
        if (k === 'p0' || k === 'p1') state.form.params[k === 'p0' ? 0 : 1] = el.value
        else state.form[k] = el.value
      })
    })
  }

  function doSearch (kw) {
    if (kw !== undefined) state.keyword = kw
    var k = String(state.keyword || '').trim()
    if (!k) { toast('请输入搜索关键词'); return }
    state.history = [k].concat(state.history.filter(function (h) { return h !== k })).slice(0, 10)
    saveJSON('zm_history', state.history)
    state.keyword = k
    state.searched = true
    render()
  }

  function submitPublishRemote (isEstimate) {
    var f = state.form
    if (!DB.logged) { showLogin(function () { submitPublishRemote(isEstimate) }); return }
    if (!f.title.trim()) return toast('请填写商品标题')
    if (!isEstimate && !String(f.price).trim()) return toast('请填写期望售价')

    var row = toRow(f)
    var jobs = (f.files || []).map(function (file) { return DB.uploadImage(file) })

    toast('正在保存…')
    Promise.all(jobs).then(function (urls) {
      row.images = urls
      row.cover = urls[0] || ''
      if (state.editingId) {
        var rid = String(state.editingId).replace(/^D/, '')
        return DB.updateDevice(rid, row).then(function () { return 'updated' })
      }
      return DB.createDevice(row).then(function () { return 'created' })
    }).then(function (what) {
      state.form = null
      state.editingId = null
      bootRemote(function () {
        toast(what === 'updated' ? '已保存' : '已上架')
        location.hash = '#/seller'
      })
    }).catch(function (e) {
      toast(e.message || '保存失败')
    })
  }

  function submitPublish (isEstimate) {
    if (DB.ready) return submitPublishRemote(isEstimate)
    var f = state.form
    if (!f.images.length && !isEstimate) return toast('请至少上传 1 张商品图片')
    if (!f.title.trim()) return toast('请填写商品标题')
    if (!f.contact.trim()) return toast('请填写联系人')
    if (!/^1\d{10}$/.test(f.phone.trim())) return toast('请填写正确的手机号')
    if (!isEstimate && !String(f.price).trim()) return toast('请填写期望售价')

    if (isEstimate) {
      var yr = parseInt(D.YEAR_OPTIONS[f.year], 10)
      var base = Math.max(1, 20 - Math.max(0, 2024 - yr) * 2)
      showDialog('估价完成',
        '参考区间：¥' + base + '–' + (base + 8) + ' 万\n（按品牌、型号、成色、注册证与近期成交价估算，实际以验机为准）',
        function () { location.hash = '#/seller' })
      return
    }

    if (state.editingId) {
      var idx = state.myItems.map(function (x) { return x.id }).indexOf(state.editingId)
      if (idx > -1) {
        var built = buildItemFromForm()
        built.id = state.editingId
        built.status = state.myItems[idx].status
        built.viewCount = state.myItems[idx].viewCount
        built.mine = true
        state.myItems[idx] = built
        saveMyItems()
      }
      state.form = null
      state.editingId = null
      showDialog('保存成功', '商品信息已更新。', function () { location.hash = '#/seller' })
      return
    }

    var item = buildItemFromForm()
    item.mine = true
    item.status = 'auditing'
    state.myItems.unshift(item)
    saveMyItems()
    state.form = null
    state.editingId = null

    showLead('商品信息已生成', leadDeviceSellText(item), '把这条信息发给客服微信 ' + CONTACT.wechat + '，我们审核后帮你上架')

    setTimeout(function () {
      var target = state.myItems.filter(function (x) { return x.id === item.id })[0]
      if (target && target.status === 'auditing') {
        target.status = 'on'
        saveMyItems()
        var cur = parseHash()
        if (cur.name === 'seller' || cur.name === 'home') {
          render()
          toast('审核通过，已上架')
        }
      }
    }, 2000)
  }

        var files = Array.prototype.slice.call(inp.files || []).slice(0, 9 - state.form.images.length)
        if (!files.length) return
        if (!state.form.files) state.form.files = []
        var done = 0
        files.forEach(function (fl) {

          fr.onload = function () {
            state.form.images.push(fr.result)
            state.form.files.push(fl)
            if (++done === files.length) render()
          }
          fr.readAsDataURL(fl)
        })
      })
      inp.click()
    },

    'pick-addr': function () {
      var list = D.REPAIR.addressList
      showSheet('选择地址', list.map(function (a) { return a.title + '（' + a.contact + '）' }), -1, function (i) {
        state.repair.address = list[i]
        render()
      })
    },
    'pick-product': function () {
      showSheet('选择维修产品', D.REPAIR.products, D.REPAIR.products.indexOf(state.repair.product), function (i) {
        state.repair.product = D.REPAIR.products[i]
        render()
      })
    },
    'pick-time': function () {
      showSheet('选择联系时间', D.REPAIR.times, D.REPAIR.times.indexOf(state.repair.time), function (i) {
        state.repair.time = D.REPAIR.times[i]
        render()
      })
    },
    'upload-repair': function () {
      var inp = document.createElement('input')
      inp.type = 'file'
      inp.accept = 'image/*'
      inp.multiple = true
      inp.addEventListener('change', function () {
        var files = Array.prototype.slice.call(inp.files || []).slice(0, 3 - state.repair.images.length)
        if (!files.length) return
        var done = 0
        files.forEach(function (fl) {
          var fr = new FileReader()
          fr.onload = function () {
            state.repair.images.push(fr.result)
            if (++done === files.length) render()
          }
          fr.readAsDataURL(fl)
        })
      })
      inp.click()
    },
    'del-repair-img': function (el) {
      state.repair.images.splice(Number(el.dataset.i), 1)
      render()
    },
    'submit-repair': function () {
      var f = state.repair
      if (!f.product) return toast('请选择维修产品')
      if (!f.time) return toast('请选择联系时间')
      if (!f.desc.trim()) return toast('请描述设备故障情况')
      if (DB.ready) {
        var d0 = new Date()
        var no = 'WX' + d0.getFullYear() + ('0' + (d0.getMonth() + 1)).slice(-2) + ('0' + d0.getDate()).slice(-2) + ('000' + Math.floor(Math.random() * 999)).slice(-3)
        DB.createRepair({
          order_no: no,
          product: f.product,
          address: f.address.title,
          contact: f.address.contact,
          phone: f.address.phone,
          contact_time: f.time,
          description: f.desc.trim(),
          description_note: f.desc.trim(),
          status: 'pending'
        }).then(function () {
          showLead('报修已提交', '【维修报修】\n单号：' + no + '\n设备：' + f.product + '\n地址：' + f.address.title + '\n联系时间：' + f.time + '\n故障：' + f.desc.trim(),
            '已同步给牙翼客服，2 小时内联系你。也可以加微信 ' + CONTACT.wechat + ' 直接沟通',
            function () { location.hash = '#/home' })
          state.repair = { address: f.address, product: '', time: '', desc: '', images: [] }
        }).catch(function (e) { toast(e.message || '提交失败') })
        return
      }
      var d = new Date()
      var oid = 'WX' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) +
        ('000' + (state.orders.length + 1)).slice(-4)
      state.orders.unshift({
        id: oid, status: 'pending', product: f.product, address: f.address,
        time: f.time, desc: f.desc.trim(), images: f.images.slice(),
        createdAt: d.toISOString().slice(0, 16).replace('T', ' ')
      })
      saveJSON('zm_orders', state.orders)
      state.repair = { address: f.address, product: '', time: '', desc: '', images: [] }
      showLead('报修信息已生成', leadRepairText(state.orders[0]),
        '把这条信息发给客服微信 ' + CONTACT.wechat + '，我们 2 小时内联系你',
        function () { location.hash = '#/repair-orders' })
    },
    'order-tab': function (el) { state.orderTab = el.dataset.k; render() },
    'do-order-search': function () {
      var el = document.getElementById('odInput')
      state.orderKeyword = el ? el.value : ''
      render()
    },
    'order-cancel': function (el) {
      var id = el.dataset.id
      showDialog('取消报修', '取消后可以重新提交报修。', function () {
        state.orders = state.orders.map(function (o) {
          if (o.id === id) o.status = 'canceled'
          return o
        })
        saveJSON('zm_orders', state.orders)
        toast('已取消')
        render()
      }, '确认取消')
    },

    'add-home': function () {
      showDialog('添加到手机桌面',
        'iPhone：用 Safari 打开 → 底部「分享」按钮 → 添加到主屏幕\n\n安卓：用浏览器打开 → 右上角菜单 → 添加到主屏幕 / 添加到桌面\n\n微信内打开的话，先点右上角「···」→ 在浏览器中打开，再按上面操作。',
        null, '知道了')
    },
    'copy-wx': function () {
      copyText(CONTACT.wechat).then(function () {
        toast('微信号已复制：' + CONTACT.wechat)
      }).catch(function () {
        showLead('加客服微信', '微信号：' + CONTACT.wechat, '长按上面的微信号复制，然后去微信搜索添加', null)
      })
    },
    'owner-login': function () { showLogin() },
    'owner-logout': function () {
      showDialog('退出登录', '退出后将看不到线索与设备管理。', function () {
        DB.logout()
        state.leads = []
        toast('已退出')
        render()
      }, '确认退出')
    },
    'r-on': function (el) { DB.updateDevice(el.dataset.id, { status: 'on' }).then(function () { bootRemote(); toast('已上架') }).catch(function (e) { toast(e.message) }) },
    'r-off': function (el) { DB.updateDevice(el.dataset.id, { status: 'off' }).then(function () { bootRemote(); toast('已下架') }).catch(function (e) { toast(e.message) }) },
    'r-del': function (el) {
      var id = el.dataset.id
      showDialog('删除设备', '删除后客户就看不到了，确定删除吗？', function () {
        DB.deleteDevice(id).then(function () { bootRemote(); toast('已删除') }).catch(function (e) { toast(e.message) })
      }, '确认删除')
    },
    'r-edit': function (el) { go('publish?edit=D' + el.dataset.id) },
    'lead-done': function (el) {
      DB.markLead(el.dataset.id, true).then(function () {
        return DB.listLeads().then(function (rows) { state.leads = rows || []; render() })
      }).catch(function (e) { toast(e.message) })
    },
    'del-sell-img': function (el) {
      var i = Number(el.dataset.i)
      state.sellForm.images.splice(i, 1)
      if (state.sellForm.files) state.sellForm.files.splice(i, 1)
      render()
    },
    'upload-sell': function () {
      var inp = document.createElement('input')
      inp.type = 'file'
      inp.accept = 'image/*'
      inp.multiple = true
      inp.addEventListener('change', function () {
        var files = Array.prototype.slice.call(inp.files || []).slice(0, 4 - state.sellForm.images.length)
        var done = 0
        files.forEach(function (fl) {
          var fr = new FileReader()
          fr.onload = function () {
            state.sellForm.images.push(fr.result)
            state.sellForm.files.push(fl)
            if (++done === files.length) render()
          }
          fr.readAsDataURL(fl)
        })
      })
      inp.click()
    },
    'submit-lead': function () {
      var f = state.sellForm
      if (!f.title.trim()) return toast('请填写设备名称')
      if (!f.contact.trim()) return toast('请填写您的称呼')
      if (!/^1\d{10}$/.test(f.phone.trim())) return toast('请填写正确的手机号')
      var text = '【我要卖机】\n设备：' + f.title + '\n品牌型号：' + (f.brand || '-') +
        '\n成色：' + (f.condition || '-') + '\n期望价格：' + (f.price ? f.price + ' 万' : '面议') +
        '\n城市：' + (f.city || '-') + '\n联系人：' + f.contact + ' ' + f.phone +
        (f.note ? '\n备注：' + f.note : '')
      if (DB.ready) {
        var jobs = (f.files || []).map(function (file) { return DB.uploadImage(file) })
        toast('正在提交…')
        Promise.all(jobs).then(function (urls) {
          return DB.createLead({
            title: f.title.trim(),
            brand: f.brand,
            condition: f.condition,
            price: f.price ? Math.round(Number(f.price) * 10000) : null,
            city: f.city,
            contact: f.contact.trim(),
            phone: f.phone.trim(),
            note: f.note,
            images: urls
          })
        }).then(function () {
          state.sellForm = null
          showLead('提交成功', text, '已同步给牙翼，24 小时内联系你。也可以加微信 ' + CONTACT.wechat + ' 直接沟通',
            function () { location.hash = '#/home' })
        }).catch(function (e) { toast(e.message || '提交失败') })
      } else {
        showLead('把你的设备发给牙翼', text, '复制这段信息，加微信 ' + CONTACT.wechat + ' 发送给客服')
      }
    },
    'copy-link': function () {
      var url = location.href.split('#')[0]
      copyText(url).then(function () { toast('链接已复制，去微信粘贴发送') })
        .catch(function () { showLead('复制链接发给对方', url, '长按上面的链接复制') })
    },

    screens: function () {
      showSheet('跳到页面',
        ['屏幕总览（全部 9 页）', '首页', '再美甄选', '设备列表', '设备详情', '发布商品', '我的店铺', '搜索', '资讯', '我的'],
        -1, function (i) {
          var map = ['wall', 'home', 'pick', 'list?cat=1', 'detail?id=DE2001', 'publish', 'seller', 'search', 'news', 'mine']
          location.hash = '#/' + map[i]
        })
    }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]')
    if (!el || !app.contains(el)) return
    var act = ACTIONS[el.dataset.act]
    if (act) {
      e.preventDefault()
      e.stopPropagation()
      act(el, e)
    }
  })

  /* ---------------- 启动 ---------------- */
  var sprite = '<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">'
  Object.keys(ICONS).forEach(function (k) {
    sprite += '<symbol id="i-' + k + '" viewBox="0 0 24 24">' + ICONS[k] + '</symbol>'
  })
  sprite += '</svg>'
  document.body.insertAdjacentHTML('afterbegin', sprite)

  window.addEventListener('hashchange', function () {
    closeOverlay()
    render()
  })
  if (!location.hash && window.innerWidth >= 900) {
    location.hash = '#/wall'
    return
  }
  render()
  if (DB.ready) {
    bootRemote()
    if (DB.logged) {
      state.ownerLogged = true
      DB.listLeads().then(function (rows) { state.leads = rows || []; render() }).catch(function () {})
    }
  }

  window.__demoReady = true
  window.__demoState = state
  window.__demoDomains = DOMAINS
})()

</script>
</body>
</html>
