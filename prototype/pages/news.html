<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资讯 · 再美二手光电</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .news-tabs {
    display: flex;
    gap: 10px;
    padding: 4px 14px 12px;
  }
  .news-tabs .nt {
    height: 32px;
    padding: 0 16px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    font-size: 13px;
    background: #fff;
    color: var(--ink-2);
    box-shadow: 0 1px 6px rgba(23, 43, 29, .06);
  }
  .news-tabs .nt.on {
    background: #14171A;
    color: #fff;
    font-weight: 700;
  }

  .news-card {
    margin: 0 14px 12px;
    background: #fff;
    border-radius: var(--r-l);
    overflow: hidden;
    box-shadow: var(--sh-card);
  }
  .news-cover {
    position: relative;
    height: 118px;
    background:
      radial-gradient(60% 90% at 12% 20%, rgba(255, 255, 255, .95), transparent 60%),
      linear-gradient(115deg, #D9EEFB 0%, #DCEFF8 45%, #EAF6EA 100%);
    overflow: hidden;
  }
  .news-cover .nc-bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(160, 205, 235, .55));
  }
  .news-cover .b1 { width: 26px; height: 26px; right: 26px; top: 74px; }
  .news-cover .b2 { width: 16px; height: 16px; right: 58px; top: 12px; }
  .news-cover .b3 { width: 10px; height: 10px; left: 16px; top: 92px; opacity: .7; }
  .news-cover .nc-head {
    position: absolute;
    left: 0; right: 0; top: 8px;
    text-align: center;
    font-size: 9px;
    letter-spacing: 1.2px;
    color: #3F6B86;
  }
  .news-cover .nc-title {
    position: absolute;
    left: 0; right: 0; top: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -1px;
    color: #0E2B3F;
    text-shadow: 1px 1px 0 #fff;
  }
  .news-cover .nc-title i {
    font-style: normal;
    color: #5FD0F0;
    text-shadow: 1px 1px 0 #fff;
  }
  .news-cover .nc-tag {
    position: absolute;
    left: 50%;
    top: 74px;
    transform: translateX(-50%);
    padding: 3px 10px;
    border-radius: 3px;
    background: #101B24;
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  .news-body { padding: 12px 13px; }
  .news-body h4 {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-foot {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .news-foot .logo {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(140deg, #DFF0C4, #8FD08A);
    display: grid;
    place-items: center;
    font-size: 9px;
    font-weight: 800;
    color: #1E3325;
  }
  .news-foot .who { font-size: 11.5px; color: var(--ink-3); }
  .news-foot .thumb {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--gray);
  }
  .news-foot .thumb .ic { width: 16px; height: 16px; }
</style>
</head>
<body class="page">
<div class="phone">
  <div class="screen has-tabbar">

    <header class="hero flat" style="padding-bottom:18px">
      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-right"><i></i></span>
      </div>
      <div class="capsule" data-capsule></div>
      <div class="nav-title">再美二手光电</div>
      <div class="news-tabs">
        <span class="nt on">全部</span>
        <span class="nt">医美周报</span>
        <span class="nt">公司新闻</span>
      </div>
    </header>

    <!-- 资讯卡片 -->
    <a class="news-card" href="detail.html">
      <div class="news-cover">
        <p class="nc-head">Medical Beauty Weekly Report</p>
        <p class="nc-title"><i>医美</i>周报</p>
        <span class="nc-tag">掌握(医美圈一手资讯)</span>
        <span class="nc-bubble b1"></span>
        <span class="nc-bubble b2"></span>
        <span class="nc-bubble b3"></span>
      </div>
      <div class="news-body">
        <h4>医美周报｜第十三期：全球认证 + 国货突破，医美硬实力进阶</h4>
        <div class="news-foot">
          <span class="logo">再美</span>
          <span class="who">再美网</span>
          <span class="thumb"><svg class="ic"><use href="#i-thumb"/></svg>1</span>
        </div>
      </div>
    </a>

    <a class="news-card" href="detail.html">
      <div class="news-cover">
        <p class="nc-head">Medical Beauty Weekly Report</p>
        <p class="nc-title"><i>医美</i>周报</p>
        <span class="nc-tag">掌握(医美圈一手资讯)</span>
        <span class="nc-bubble b1"></span>
        <span class="nc-bubble b2"></span>
        <span class="nc-bubble b3"></span>
      </div>
      <div class="news-body">
        <h4>医美周报｜第十二期：明星资本入局，医美新品扎堆来袭</h4>
        <div class="news-foot">
          <span class="logo">再美</span>
          <span class="who">再美网</span>
          <span class="thumb"><svg class="ic"><use href="#i-thumb"/></svg>3</span>
        </div>
      </div>
    </a>

    <a class="news-card" href="detail.html">
      <div class="news-cover" style="background:radial-gradient(60% 90% at 12% 20%, rgba(255,255,255,.95), transparent 60%), linear-gradient(115deg, #E8F4DA 0%, #DFF0C4 55%, #F6F7D8 100%)">
        <p class="nc-head">Company News · 再美</p>
        <p class="nc-title" style="font-size:30px">再美<span style="font-size:16px;margin-left:6px;color:#2B7A4B">动态</span></p>
        <span class="nc-tag">再美二手光电 · 平台公告</span>
        <span class="nc-bubble b1"></span>
        <span class="nc-bubble b2"></span>
        <span class="nc-bubble b3"></span>
      </div>
      <div class="news-body">
        <h4>再美甄选上线：每台设备出质检报告，二手医美设备也能"无忧购"</h4>
        <div class="news-foot">
          <span class="logo">再美</span>
          <span class="who">再美网</span>
          <span class="thumb"><svg class="ic"><use href="#i-thumb"/></svg>12</span>
        </div>
      </div>
    </a>

    <p class="empty" style="padding:22px 0 8px">— 没有更多资讯了 —</p>
  </div>

  <nav class="tabbar" data-tabbar="news"></nav>
</div>
<script src="../assets/js/common.js"></script>
</body>
</html>
