<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牙翼 · 扫码体验</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(90% 70% at 50% 0%, #E9F5DE 0%, #F6FAF3 55%, #FFFFFF 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #16261B; padding: 32px 20px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #23754A; }
  .brand i { font-style: normal; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(140deg,#8FD46C,#3F8F42); }
  .sub { margin-top: 10px; font-size: 13px; color: #5A7A64; letter-spacing: .5px; }
  .card {
    margin-top: 26px; padding: 24px;
    background: #fff; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(31, 94, 60, .14);
    text-align: center;
  }
  .card img { width: 260px; height: 260px; display: block; }
  .url {
    margin-top: 18px; font-size: 12px; color: #6C727B;
    word-break: break-all; max-width: 300px;
  }
  .tip { margin-top: 8px; font-size: 12px; color: #8C929B; }
  .btn {
    display: inline-block; margin-top: 18px; padding: 11px 26px;
    border-radius: 22px; background: linear-gradient(120deg, #A8DA8A, #3F8F5B);
    color: #fff; text-decoration: none; font-size: 14px; font-weight: 700;
    box-shadow: 0 10px 24px rgba(63, 143, 91, .3);
  }
  .feat { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .feat span { font-size: 12px; color: #33724E; background: #EDF7E4; padding: 6px 13px; border-radius: 13px; }
  @media (max-width: 420px) { .card img { width: 220px; height: 220px; } }
</style>
</head>
<body>
  <div class="brand"><i></i>牙翼</div>
  <div class="sub">二手牙科设备 · 自主上架 · 维修服务</div>

  <div class="card">
    <img src="./qr.png" alt="扫码体验牙翼">
    <div class="url">https://zhaosirhi-cell.github.io/yayi/</div>
    <div class="tip">手机扫一扫，或直接点下面的按钮</div>
    <a class="btn" href="./demo/index.html">打开演示 →</a>
  </div>

  <div class="feat">
    <span>11 个页面</span><span>自主上架商品</span><span>维修报修</span><span>我的订单</span>
  </div>
</body>
</html>
